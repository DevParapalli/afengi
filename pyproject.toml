[project]
name = "afengi"
version = "0.1.1"
description = "This is a FastAPI-based A2A Service exposing a single agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.0",
    "google-adk[a2a]>=2.3.0",
    "httpx2>=2.5.0",
    "litellm>=1.93.0",
    # google-adk requires mcp<2 (the 2.x restructure drops mcp.shared.session);
    # this project depends on mcp directly, so the bound has to be repeated here.
    "mcp>=1.28.1,<2",
    "pyjwt[crypto]>=2.13.0",
    "sqlalchemy>=2.0.51",
    "tenacity>=9.1.4",
    "uvicorn>=0.50.2",
]

# Database drivers are optional. With no driver installed the app runs either
# without persistence (empty DB_URL) or on SQLite (Python stdlib, no extra). Add
# an extra only for Postgres or Oracle:
#   uv sync --extra postgres   |   uv sync --extra oracle
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
oracle = ["oracledb>=2.4"]
db = ["psycopg[binary]>=3.2", "oracledb>=2.4"]

[tool.uv]
# App project, not a distributable package: uv installs dependencies but does not
# build/install this project. framework/ + agent/ are imported from source (run
# from the project root). Version is read from [project].version above at runtime
# (see framework/config.py), not from installed dist metadata.
package = false

[tool.ruff]
line-length = 96
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "N", "UP", "SIM", "RUF", "FAST", "ASYNC", "C4", "FIX", "T20", "RET", "PERF",]
unfixable = ["E501"]
ignore = [ "E501", "C901", "W191", "E111", "E114", "E117"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.11",
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T201", "RET504"]
"__/**" = ["T201", "RET504"]
"tests/**" = ["F841", "E402"]
